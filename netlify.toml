[build]
  command = "bun run build"
  publish = "dist/apps/iswavle/browser"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "https://iswavle.ge/*"
  to = "https://iswavle.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.iswavle.ge/*"
  to = "https://iswavle.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"

[headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Opener-Policy = "same-origin"