[build]
  command = "bun run build"
  publish = "dist/iswavle/browser"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "https://iswavle.com/:splat"
  status = 301
  force = true
  conditions = { Host = "iswavle.ge" }

[[redirects]]
  from = "/*"
  to = "/index.html"

[headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Opener-Policy = "same-origin"